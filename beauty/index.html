<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--navy:#1F3A5F;--gold:#E8A317;--bg:#F3F5F8;--line:#DDE2EA;--ok:#1E8E5A;--warn:#D9822B;--bad:#C83D3D;--mut:#6B7685}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:#1d2430;font-size:15px}
header{background:var(--navy);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px;letter-spacing:.5px}
header small{opacity:.8}
nav{display:flex;background:var(--navy);padding:0 6px;overflow-x:auto;position:sticky;top:52px;z-index:5}
nav button{flex:1;min-width:64px;background:none;border:0;color:#C9D3E2;padding:10px 4px 12px;font-size:14px;border-bottom:3px solid transparent;position:relative}
nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
nav .badge{position:absolute;top:4px;right:8px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
main{padding:12px 12px 90px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit}
textarea{min-height:60px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.seg{display:flex;border:1px solid var(--navy);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:var(--navy);padding:9px 4px;font-size:15px}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:14px;color:#2b3442}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.add{border-style:dashed;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.code{border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px 2px;text-align:center}
.code b{display:block;font-size:15px}.code span{font-size:12px;color:var(--mut)}
.code.on{background:var(--navy);border-color:var(--navy);color:#fff}.code.on span{color:#C9D3E2}
.item{display:flex;gap:6px;align-items:center;margin-top:7px}
.item .nm{flex:2;font-size:14px}.item input{flex:1;min-width:0}
.x{flex:none;border:0;background:#F1F2F4;color:var(--mut);width:34px;height:34px;border-radius:8px;font-size:18px}
.sum{display:flex;justify-content:space-between;background:#F7F4EA;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.sum b{font-size:20px;color:var(--navy)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;background:var(--navy);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.5}
.mut{color:var(--mut);font-size:13px}
.warn{color:var(--bad);font-size:13px}
.vl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.vl div{padding:9px 10px;border-bottom:1px solid #EEF0F3}
.vl div:last-child{border:0}
.sel{display:flex;justify-content:space-between;align-items:center;background:#EEF3FA;border-radius:9px;padding:10px}
.st{display:inline-block;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600}
.st-待審核{background:#FFF1DC;color:var(--warn)}.st-待簽收{background:#E4EEFF;color:#2B62C9}
.st-退回{background:#FCE4E4;color:var(--bad)}.st-已完成{background:#E1F4EA;color:var(--ok)}
.rec .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rec p{margin:3px 0;font-size:14px}
.rec a{color:#2B62C9}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:#F6F8FB;border-radius:9px;padding:9px}
.kpi b{display:block;font-size:19px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:9px;background:#E9ECF1;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid #EEF0F3;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
.bill{border-top:1px solid #EEF0F3;padding:10px 0}
.bill:first-of-type{border:0}
.bill .top{display:flex;gap:8px;align-items:flex-start}
.bill .top input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px}
.bill .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tog{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:14px}
.tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
.batch{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12);padding:10px 12px;z-index:8}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
canvas{width:100%;height:230px;border:1px dashed #9AA6B6;border-radius:10px;touch-action:none;background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:.95}
#toast:empty{display:none}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs div{position:relative}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--bad);color:#fff;border-radius:50%;width:22px;height:22px}
.center{text-align:center;padding:40px 10px;color:var(--mut)}
</style>
</head>
<body>
<header><h1>頂好汽車｜美容部</h1><small id="who">載入中…</small></header>
<nav id="tabs"></nav>
<main id="view"><div class="center">載入中…</div></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ======== 設定：只需要改這兩行 ======== */
const LIFF_ID = '2012275132-4y41toeK';
const API_URL = '請貼上Apps Script部署網址（結尾是/exec）';
/* ===================================== */
let B = null, TAB = '', F = null, BILL = { sel: {} };

/* ---------- 共用 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n === '' || n == null ? '—' : '$' + Number(n).toLocaleString();
const r2 = n => Math.round(n * 100) / 100;
const thisMonth = () => B.today.slice(0, 7);
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 2600); }
function withTimeout(p, ms, msg) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
}
async function call(action, payload) {
  let tok = null; try { tok = liff.getIDToken(); } catch (e) {}
  let res;
  try {
    res = await withTimeout(fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, idToken: tok, payload: payload || null }) }), 45000, '伺服器回應逾時，請稍後再試');
  } catch (e) { throw new Error(e.message.indexOf('逾時') >= 0 ? e.message : '連不到伺服器，請確認網路後再試'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('伺服器回應格式錯誤（請確認 API 網址與部署設定）'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function fatal(msg) { $('who').textContent = ''; $('view').innerHTML = '<div class="center">⚠️ ' + esc(msg) + '</div>'; }
function busy(btn, on, text) { if (!btn) return; btn.disabled = on; if (on) { btn._t = btn.textContent; btn.textContent = text || '處理中…'; } else if (btn._t) btn.textContent = btn._t; }

/* ---------- 啟動 ---------- */
async function boot() {
  try {
    if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('index.html 裡的 API_URL 還沒填');
    $('who').textContent = '連線 LINE 中…';
    await withTimeout(liff.init({ liffId: LIFF_ID }), 15000, '無法連線 LINE，請關閉後重新開啟');
    if (!liff.isLoggedIn()) {
      if (liff.isInClient()) { liff.login(); return; }
      throw new Error('請從 LINE「頂好汽車｜文中店打卡」的選單開啟本頁');
    }
    $('who').textContent = '讀取資料中…';
    B = await call('init');
    $('who').textContent = B.me.name + '・' + B.me.dept;
    newForm();
    go(B.me.isTech ? 'new' : (B.me.isReviewer && B.pending ? 'review' : (B.me.isAdmin ? 'bill' : 'list')));
  } catch (e) { fatal(e.message); }
}

function tabs() {
  const t = [];
  if (B.me.isTech || B.me.isAdmin) t.push(['new', '登記']);
  t.push(['list', '紀錄']);
  if (B.me.isReviewer) t.push(['review', '審核']);
  if (B.me.isAdmin) t.push(['bill', '帳務']);
  t.push(['stats', '統計']);
  $('tabs').innerHTML = t.map(([k, n]) => '<button class="' + (TAB === k ? 'on' : '') + '" onclick="go(\'' + k + '\')">' + n +
    (k === 'review' && B.pending ? '<span class="badge">' + B.pending + '</span>' : '') + '</button>').join('');
}
function go(tab) {
  TAB = tab; tabs(); window.scrollTo(0, 0);
  ({ new: renderForm, list: renderList, review: renderReview, bill: renderBill, stats: renderStats })[tab]();
}

/* ---------- 登記表單 ---------- */
function newForm() {
  F = { id: null, date: B.today, ctype: '公司車', vehicleId: '', vq: '', cname: '', plate: '', model: '', phone: '', amount: '',
    code: '', addons: [], techs: B.me.isTech ? [B.me.name] : (B.techs.length === 1 ? [B.techs[0]] : []), alloc: {}, manual: false,
    photos: [], note: '', signNow: false, sign: null, addingPeer: false };
  autoSplit();
}
const baseOf = () => { const c = B.codes.find(x => x.code === F.code); return c ? c.points : 0; };
const extraOf = () => r2(F.addons.reduce((s, a) => s + (parseFloat(a.points) || 0), 0));
const totalOf = () => r2(baseOf() + extraOf());
const allocSum = () => r2(F.techs.reduce((s, n) => s + (parseFloat(F.alloc[n]) || 0), 0));
function autoSplit() {
  if (F.manual || !F.techs.length) return;
  const tot = totalOf(), n = F.techs.length, each = Math.floor(tot / n * 2) / 2;
  F.techs.forEach((t, i) => F.alloc[t] = i === 0 ? r2(tot - each * (n - 1)) : each);
}

function renderForm() {
  const v = $('view');
  let h = '';
  if (F.id) h += '<div class="card" style="background:#FFF6E5"><b>修改退回的紀錄</b><br><span class="mut">改好後按最下方「重新送出」</span> <button class="btn sm sec" onclick="newForm();renderForm()">取消修改</button></div>';
  h += '<div class="card"><h3>基本資料</h3><label class="f">施工日期</label><input type="date" value="' + F.date + '" onchange="F.date=this.value">' +
    '<label class="f">客戶類別</label><div class="seg">' + ['公司車', '同行', '客戶'].map(t =>
      '<button class="' + (F.ctype === t ? 'on' : '') + '" onclick="setType(\'' + t + '\')">' + t + '</button>').join('') + '</div>' +
    '<div id="who-area">' + whoArea() + '</div></div>';

  h += '<div class="card"><h3>施作代碼</h3><div class="grid">' + B.codes.map(c =>
      '<button class="code ' + (F.code === c.code ? 'on' : '') + '" onclick="setCode(\'' + c.code + '\')"><b>' + esc(c.code) + '</b><span>' + c.points + ' 點</span></button>').join('') +
    '<button class="code ' + (F.code === '無' ? 'on' : '') + '" onclick="setCode(\'無\')"><b>無</b><span>只有加費</span></button></div></div>';

  h += '<div class="card"><h3>加費／特殊項目</h3><div class="chips">' + B.addons.map(a =>
      '<button class="chip" onclick="addAddon(' + esc(JSON.stringify(a)) + ')">＋' + esc(a) + '</button>').join('') +
    '<button class="chip add" onclick="addAddon(\'\')">＋其他</button></div><div id="addons">' + addonRows() + '</div>' +
    '<div class="sum" id="sum">' + sumHtml() + '</div></div>';

  h += '<div class="card"><h3>施工技師與點數分配</h3><div class="chips">' + B.techs.map(t =>
      '<button class="chip ' + (F.techs.indexOf(t) >= 0 ? 'on' : '') + '" onclick="toggleTech(' + esc(JSON.stringify(t)) + ')">' + esc(t) + '</button>').join('') +
    '</div><div id="alloc">' + allocRows() + '</div></div>';

  h += '<div class="card"><h3>照片（選填，最多 3 張）</h3><input type="file" accept="image/*" multiple onchange="addPhotos(this)">' +
    '<div class="thumbs">' + F.photos.map((p, i) => '<div><img src="' + p + '"><button onclick="F.photos.splice(' + i + ',1);renderForm()">×</button></div>').join('') + '</div>' +
    (F.id ? '<div class="mut">沒有重新上傳就保留原本的照片</div>' : '') +
    '<label class="f">備註</label><textarea oninput="F.note=this.value">' + esc(F.note) + '</textarea></div>';

  if (F.ctype !== '公司車') {
    h += '<div class="card"><h3>交車簽收</h3><div class="seg"><button class="' + (F.signNow ? 'on' : '') + '" onclick="F.signNow=true;renderForm()">現在簽收</button>' +
      '<button class="' + (!F.signNow ? 'on' : '') + '" onclick="F.signNow=false;F.sign=null;renderForm()">交車時再簽</button></div>';
    if (F.signNow) h += F.sign ? '<p>簽收人：<b>' + esc(F.sign.name) + '</b></p><img src="' + F.sign.image + '" style="width:100%;border:1px solid var(--line);border-radius:8px"><button class="btn sm sec" onclick="signForForm()">重新簽名</button>'
      : '<p class="mut">把手機交給客戶，請他填姓名並簽名。</p><button class="btn sec" onclick="signForForm()">開啟簽名板</button>';
    else h += '<p class="mut">送出後列為「待簽收」，交車時到「紀錄」頁按「客戶簽收」。</p>';
    h += '</div>';
  } else h += '<p class="mut" style="margin:0 4px 12px">公司車送出後由 ' + esc('主管／行政') + ' 審核，審核通過就完成品管。</p>';

  h += '<button class="btn" id="submitBtn" onclick="submitForm()">' + (F.id ? '重新送出' : '送出') + '</button>';
  v.innerHTML = h;
}

function whoArea() {
  if (F.ctype === '公司車') {
    if (F.vehicleId) {
      const c = B.vehicles.find(x => x.id === F.vehicleId) || {};
      return '<label class="f">公司車</label><div class="sel"><div><b>' + esc(c.plate) + '</b>　' + esc(c.brand + ' ' + c.model) +
        '<br><span class="mut">' + esc(c.id) + (c.color ? '・' + esc(c.color) : '') + '・已美容 ' + (c.washes || 0) + ' 次' + (c.sold ? '・已交車' : '') + '</span></div>' +
        '<button class="btn sm sec" onclick="F.vehicleId=\'\';refreshWho()">更換</button></div>';
    }
    return '<label class="f">選擇公司車（輸入車牌或車型搜尋）</label><input placeholder="例：BLX 或 C300" value="' + esc(F.vq) + '" oninput="F.vq=this.value;$(\'vl\').innerHTML=vehList()">' +
      '<div class="vl" id="vl">' + vehList() + '</div>';
  }
  let h = '';
  if (F.ctype === '同行') {
    h += '<label class="f">同行</label><div class="chips">' + B.peers.map(p =>
      '<button class="chip ' + (F.cname === p ? 'on' : '') + '" onclick="F.cname=' + esc(JSON.stringify(p)) + ';refreshWho()">' + esc(p) + '</button>').join('') +
      '<button class="chip add" onclick="F.addingPeer=true;refreshWho()">＋新增同行</button></div>';
    if (F.addingPeer) h += '<div class="row" style="margin-top:8px"><input id="newPeer" placeholder="同行名稱"><button class="btn sm" style="flex:none" onclick="addPeer(this)">新增</button></div>' +
      '<div class="mut">聯絡人、統編等資料由行政在「帳務」頁補齊</div>';
  } else {
    h += '<div class="row"><div><label class="f">客戶姓名</label><input value="' + esc(F.cname) + '" oninput="F.cname=this.value"></div>' +
      '<div><label class="f">電話</label><input type="tel" value="' + esc(F.phone) + '" oninput="F.phone=this.value"></div></div>';
  }
  h += '<div class="row"><div><label class="f">車型 *</label><input value="' + esc(F.model) + '" oninput="F.model=this.value" placeholder="例：C300"></div>' +
    '<div><label class="f">車牌（選填）</label><input value="' + esc(F.plate) + '" oninput="F.plate=this.value"></div></div>';
  if (B.me.isAdmin || B.me.isTech) h += '<label class="f">收費金額（選填，可之後由行政填）</label><input type="number" inputmode="numeric" value="' + esc(F.amount) + '" oninput="F.amount=this.value">';
  return h;
}
function refreshWho() { $('who-area').innerHTML = whoArea(); }
function vehList() {
  const q = F.vq.trim().toUpperCase();
  const list = B.vehicles.filter(c => !q || (c.plate + ' ' + c.brand + ' ' + c.model + ' ' + c.id).toUpperCase().indexOf(q) >= 0).slice(0, 40);
  if (!list.length) return '<div class="mut">找不到車輛</div>';
  return list.map(c => '<div onclick="F.vehicleId=\'' + c.id + '\';refreshWho()"><b>' + esc(c.plate) + '</b>　' + esc(c.brand + ' ' + c.model) +
    ' <span class="mut">' + esc(c.color) + (c.washes ? '・美容 ' + c.washes + ' 次' : '') + (c.sold ? '・已交車' : '') + '</span></div>').join('');
}
function setType(t) { F.ctype = t; F.cname = ''; F.signNow = false; F.sign = null; renderForm(); }
function setCode(c) { F.code = c; autoSplit(); renderForm(); }
async function addPeer(btn) {
  const name = $('newPeer').value.trim();
  if (!name) return toast('請輸入同行名稱');
  busy(btn, true);
  try {
    const r = await call('peerSave', { name: name });
    if (B.peers.indexOf(r.name) < 0) B.peers.push(r.name);
    F.cname = r.name; F.addingPeer = false; refreshWho(); toast('已新增同行：' + r.name);
  } catch (e) { toast(e.message); busy(btn, false); }
}

function addonRows() {
  return F.addons.map((a, i) => '<div class="item">' + (a.custom
      ? '<input class="nm" placeholder="項目名稱" value="' + esc(a.item) + '" oninput="F.addons[' + i + '].item=this.value">'
      : '<span class="nm">' + esc(a.item) + '</span>') +
    '<input type="number" inputmode="decimal" step="0.5" placeholder="點數" value="' + esc(a.points) + '" oninput="F.addons[' + i + '].points=this.value;onPts()">' +
    '<button class="x" onclick="F.addons.splice(' + i + ',1);onPts(true)">×</button></div>').join('');
}
function addAddon(item) { F.addons.push({ item: item, points: '', custom: !item }); $('addons').innerHTML = addonRows(); const ins = $('addons').querySelectorAll('input'); ins[ins.length - 1].focus(); }
function sumHtml() { return '<span>基本 ' + baseOf() + ' ＋ 加費 ' + extraOf() + '</span><span>本車總點數 <b>' + totalOf() + '</b></span>'; }
function onPts(redrawAddons) { autoSplit(); if (redrawAddons) $('addons').innerHTML = addonRows(); $('sum').innerHTML = sumHtml(); $('alloc').innerHTML = allocRows(); }

function toggleTech(t) {
  const i = F.techs.indexOf(t);
  if (i >= 0) { F.techs.splice(i, 1); delete F.alloc[t]; } else F.techs.push(t);
  F.manual = false; autoSplit(); renderForm();
}
function allocRows() {
  if (!F.techs.length) return '<p class="mut">請點選施工技師</p>';
  const diff = r2(totalOf() - allocSum());
  return F.techs.map(t => '<div class="item"><span class="nm">' + esc(t) + '</span><input type="number" inputmode="decimal" step="0.5" value="' + esc(F.alloc[t]) +
      '" oninput="F.alloc[' + esc(JSON.stringify(t)) + ']=this.value;F.manual=true;$(\'adiff\').innerHTML=diffHtml()"><span class="mut" style="flex:none">點</span></div>').join('') +

async function addPhotos(inp) {
  const files = Array.from(inp.files || []).slice(0, 3 - F.photos.length);
  for (const f of files) F.photos.push(await shrink(f, 1280, 0.72));

}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
      img.onerror = rej; img.src = rd.result; };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

function openSign(title, name, done) {
  $('mbox').innerHTML = '<h3 style="margin:0 0 8px;color:var(--navy)">' + esc(title) + '</h3>' +
    '<label class="f">簽收人姓名</label><input id="sgName" value="' + esc(name || '') + '">' +
    '<label class="f">請在框內簽名</label><canvas id="pad"></canvas>' +
    '<div class="acts"><button class="btn sec" onclick="clearPad()">清除</button><button class="btn sec" onclick="closeModal()">取消</button><button class="btn" id="sgOk">確認</button></div>';
  $('modal').classList.add('on');
  const cv = $('pad'), r = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
  const ctx = cv.getContext('2d'); ctx.scale(r, r); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); cv._drawn = false;
  let drawing = false;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = e => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); cv._drawn = true; };
  cv.onpointerup = cv.onpointercancel = () => drawing = false;
  $('sgOk').onclick = () => {
    const n = $('sgName').value.trim();
    if (!n) return toast('請填寫簽收人姓名');
    if (!cv._drawn) return toast('請先簽名');
    closeModal(); done({ name: n, image: cv.toDataURL('image/png') });
  };
}
function clearPad() { const cv = $('pad'), ctx = cv.getContext('2d'); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); cv._drawn = false; }
function closeModal() { $('modal').classList.remove('on'); }

    if (B.me.isAdmin) {
      const s = d.summary;
      h += '<div class="card"><h3>本月總覽</h3><div class="kpi"><div><b>' + s.records + '</b><span>施工台次</span></div><div><b>' + s.points + '</b><span>完成點數</span></div>' +
        '<div><b>' + s.done + '</b><span>已完成</span></div><div><b>' + s.pending + '</b><span>待審核／待簽收</span></div></div></div>';
      const tbl = (title, rows, p) => rows.length ? '<div class="card"><h3>' + title + '</h3><table><tr><th>項目</th><th class="n">次數</th><th class="n">' + p + '</th></tr>' +
        rows.map(r => '<tr><td>' + esc(r.key) + '</td><td class="n">' + r.count + '</td><td class="n">' + r.points + '</td></tr>').join('') + '</table></div>' : '';
      h += tbl('客戶類別', d.byType, '總點數') + tbl('施作代碼', d.byCode, '基本點數') + tbl('加費／特殊項目', d.byAddon, '加費點數');
      if (d.cars.length) h += '<div class="card"><h3>公司車清洗紀錄</h3><table><tr><th>車輛</th><th class="n">本月</th><th class="n">累計</th></tr>' +
        d.cars.map(c => '<tr><td><b>' + esc(c.plate || '') + '</b> ' + esc(c.model) + '<br><span class="mut">' + c.items.map(esc).join('<br>') + '</span></td><td class="n">' + c.month + '</td><td class="n">' + c.total + '</td></tr>').join('') + '</table></div>';
    }
    $('sv').className = ''; $('sv').innerHTML = h || '<div class="center">沒有資料</div>';
  } catch (e) { $('sv').innerHTML = esc(e.message); }
}

$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
boot();
</script>
</body>
</html>
